apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: frontend
        image: everyday-is-devops-day-frontend:sha-a123
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080

        # Load all environment variables from the ConfigMap
        envFrom:
        - configMapRef:
            name: frontend-config

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80         # Internal cluster port
      targetPort: 8080 # Port exposed by container
      nodePort: 30080  # Port exposed on Minikube