apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2 # Orchestrates 2 running pods for high availability
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: everyday-is-devops-day-frontend:sha-a123
        # Prevents K8s from trying to pull from Docker Hub since image is local
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 8080 # Matches Chainguard Nginx default port
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80         # Internal cluster port
      targetPort: 8080 # Port exposed by your Docker container
      nodePort: 30080  # Optional static port exposed on Minikube node