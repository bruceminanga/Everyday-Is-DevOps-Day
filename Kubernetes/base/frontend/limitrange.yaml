apiVersion: v1
kind: LimitRange
metadata:
  name: frontend-limit-range
  namespace: frontend-prod
spec:
  limits:
  - type: Container
    default:
      cpu: "200m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "1000m"
      memory: "1Gi"
    min:
      cpu: "20m"
      memory: "32Mi"
