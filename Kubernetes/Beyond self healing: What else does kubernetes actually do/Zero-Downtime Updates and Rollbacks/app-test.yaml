apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-downtime-app
  labels:
    app: zero-downtime-app
spec:
  replicas: 3
  minReadySeconds: 5   # Buffer so a flaky pod isn't counted as ready immediately
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Guarantees capacity never drops below desired count
  selector:
    matchLabels:
      app: zero-downtime-app
  template:
    metadata:
      labels:
        app: zero-downtime-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: web
        image: nginx:1.24
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 2
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        lifecycle:
          preStop:
            exec:
              # Wait 10s for Ingress/Endpoints to deregister IP, then gracefully exit
              command: ["/bin/sh", "-c", "sleep 10 && nginx -s quit"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zero-downtime-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: zero-downtime-app
---
apiVersion: v1
kind: Service
metadata:
  name: zero-downtime-svc
spec:
  type: ClusterIP
  selector:
    app: zero-downtime-app
  ports:
  - port: 80
    targetPort: 80