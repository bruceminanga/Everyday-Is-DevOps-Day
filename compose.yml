name: everyday-is-devops-day-local
services:
  db:
    image: postgres:16-alpine
    env_file:
      - backend/.env.dev
    ports:
      - "127.0.0.1:5432:5432"  # loopback only — not reachable from LAN
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # migrate:
  #   build: .
  #   entrypoint: ["/usr/bin/python3", "manage.py"]
  #   command: ["migrate"]
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file:
  #     - backend/.env.dev

  backend:
    build:
      context: backend/
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env.dev
    volumes:
      - ./backend:/app          # bind mount for hot-reload — adjust /app to your WORKDIR
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/items')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - internal   # to reach db
      - public      # to be reachable by frontend/host

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - frontend/.env.dev
    volumes:
      - ./frontend:/app          # bind mount for hot-reload
      - /app/node_modules        # anonymous volume so host doesn't overwrite installed deps
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public

networks:
  internal:
    internal: true   # db is unreachable from outside this network, no external egress either
  public:
    driver: bridge

volumes:
  postgres_data:
