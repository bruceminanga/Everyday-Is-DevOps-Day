name: everyday-is-devops-day-local

services:
  db:
    image: postgres:16-alpine
    env_file:
      - backend/.env.dev
    ports:
      - "5432:5432"  # convenient for local DB inspection
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # migrate:
  #   build: .
  #   entrypoint: ["/usr/bin/python3", "manage.py"]
  #   command: ["migrate"]
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file:
  #     - backend/.env.dev

  backend:
    build:
      context: backend/
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/items')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    env_file:
      - frontend/.env.dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
