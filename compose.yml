name: everyday-is-devops-day-local
services:
  db:
    image: postgres:16-alpine
    env_file:
      - backend/.env.dev
    ports:
      - "127.0.0.1:5432:5432"  # loopback only — not reachable from LAN
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # migrate:
  #   build: .
  #   entrypoint: ["/usr/bin/python3", "manage.py"]
  #   command: ["migrate"]
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file:
  #     - backend/.env.dev

  backend:
    build:
      context: backend/
      dockerfile: Dockerfile.dev
    command: ["python3", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env.dev
    volumes:
      - ./backend:/app          # bind mount for hot-reload — adjust /app to your WORKDIR
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/items')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - internal   # to reach db
      - public      # to be reachable by frontend/host

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    env_file:
      - frontend/.env.dev
    volumes:
      - ./frontend:/app          # bind mount for hot-reload
      - /app/node_modules        # anonymous volume so host doesn't overwrite installed deps
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
  # ==========================================
  # DevOps Monitoring Stack (No Code Modified)
  # ==========================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    security_opt:
      - label=disable               # <-- CRITICAL for Fedora / SELinux
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro  # <-- Required for modern cgroups v2
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - public

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - public

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z
    depends_on:
      - cadvisor
      - node-exporter
    networks:
      - public

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - public

networks:
  internal:
    internal: true   # db is unreachable from outside this network, no external egress either
  public:
    driver: bridge

volumes:
  postgres_data:
