name: Docker CI/CD Pipeline

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  lint-build-test-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend] # Runs pipeline in parallel for both services
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Lint Dockerfile (Ignores DL3006 for ARG base image false-positives)
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          failure-threshold: warning
          ignore: DL3006

      # Step 3: Set up build tools
      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Extract tags & labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      # Step 5: Log into GitHub Container Registry
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Build locally for testing
      - name: Build local image for testing
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true # Loads into runner's local Docker daemon
          tags: test-${{ matrix.service }}:latest

      # Step 7: Universal Container Health Test (No Nginx/Python specific code)
      - name: Test Docker Image
        run: |
          echo "Starting test container for ${{ matrix.service }}..."
          docker run -d --name test-app test-${{ matrix.service }}:latest

          # Give the container 3 seconds to initialize
          sleep 3

          # Check if the container is still running or crashed on boot
          if [ "$(docker inspect -f '{{.State.Running}}' test-app)" != "true" ]; then
            echo "❌ Container failed to stay alive on startup!"
            echo "=== Container Logs ==="
            docker logs test-app
            exit 1
          fi

          echo "✅ Container started and is running cleanly!"
          docker rm -f test-app

      # Step 8: Multi-Arch Build and Push
      - name: Build and Push Multi-Arch Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
